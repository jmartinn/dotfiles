# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# Uses gh's default repository; for forks, select the PR's base repository with
# `gh repo set-default upstream` from the checkout if automatic detection differs.
# Return directly after quitting a pager/editor (applies to all subprocesses).
promptToReturnFromSubprocess: false

customCommands:
  - key: 'v'
    context: 'localBranches'
    description: 'Check out an open GitHub PR'
    loadingText: 'Checking out pull request'
    command: 'gh pr checkout {{.Form.PR | quote}}'
    prompts:
      - type: 'menuFromCommand'
        title: 'Open pull requests (up to 100) — select to check out'
        key: 'PR'
        command: >-
          gh pr list --state open --limit 100 --json number,title
          --jq '.[] | "#" + (.number | tostring) + ": " + .title'
        filter: '#(?P<number>[0-9]+): (?P<title>[^\r\n]*)'
        valueFormat: '{{.number}}'
        labelFormat: '#{{.number}} {{.title}}'

  - key: 'V'
    context: 'localBranches'
    description: 'Read my GitHub PRs with rendered Markdown (all states)'
    # A terminal subprocess lets gh render Markdown and include the discussion.
    # LazyGit cannot direct custom output into its main [0] pane.
    # Use the selected URL so interactive gh also targets the upstream repository.
    command: >-
      GH_PAGER='less -R' gh pr view {{.Form.PR | quote}} --comments
    output: 'terminal'
    prompts:
      - type: 'menuFromCommand'
        title: 'My pull requests (all states, up to 100) — select to read'
        key: 'PR'
        command: >-
          gh pr list --author @me --state all --limit 100 --json number,title,state,url
          --jq '.[] | .url + " #" + (.number | tostring) + ": [" + .state + "] " + .title'
        filter: '(?P<url>https://[^ ]+) #(?P<number>[0-9]+): (?P<title>[^\r\n]*)'
        valueFormat: '{{.url}}'
        labelFormat: '#{{.number}} {{.title}}'
