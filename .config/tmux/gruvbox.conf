# Gruvbox Hard. Native theme colours adapt per client without reloading (tmux 3.8+).
set -g theme detect

# Semantic roles: black = background, white = text, dark-grey = surface,
# light-grey = muted text. Light mode reverses the neutral colours.
set -g dark-theme-black '#1d2021'
set -g dark-theme-white '#ebdbb2'
set -g dark-theme-dark-grey '#3c3836'
set -g dark-theme-light-grey '#a89984'
set -g dark-theme-red '#fb4934'
set -g dark-theme-green '#b8bb26'
set -g dark-theme-yellow '#fabd2f'
set -g dark-theme-blue '#83a598'
set -g dark-theme-magenta '#d3869b'
set -g dark-theme-cyan '#8ec07c'

set -g light-theme-black '#f9f5d7'
set -g light-theme-white '#3c3836'
set -g light-theme-dark-grey '#ebdbb2'
set -g light-theme-light-grey '#7c6f64'
set -g light-theme-red '#9d0006'
set -g light-theme-green '#79740e'
set -g light-theme-yellow '#b57614'
set -g light-theme-blue '#076678'
set -g light-theme-magenta '#8f3f71'
set -g light-theme-cyan '#427b58'

set -g status-style 'bg=themeblack,fg=themewhite'
set -g status-left-length 40
set -g status-left-style default
set -g status-left '#[bg=themegreen,fg=themeblack,bold] #S #[default]#{?client_prefix,#[fg=themeyellow] PREFIX ,} '
set -g status-right-length 100
set -g status-right-style default
set -g status-right '#[fg=themecyan] #{b:pane_current_path} #[fg=themelightgrey]│ %Y-%m-%d #[fg=themewhite]%H:%M '
set -g status-justify left

setw -g window-status-style 'bg=themeblack,fg=themelightgrey'
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-style 'bg=themedarkgrey,fg=themegreen,bold'
setw -g window-status-current-format ' #I:#W#F '
setw -g window-status-separator ' '
setw -g window-status-last-style default
setw -g window-status-activity-style 'fg=themeyellow'
setw -g window-status-bell-style 'fg=themered,bold'

set -g pane-border-style 'fg=themedarkgrey'
set -g pane-active-border-style 'fg=themegreen'
set -g message-style 'bg=themedarkgrey,fg=themewhite'
set -g message-command-style 'bg=themedarkgrey,fg=themeyellow'
setw -g mode-style 'bg=themedarkgrey,fg=themeyellow'
setw -g clock-mode-colour themeblue
set -g display-panes-colour themelightgrey
set -g display-panes-active-colour themegreen
